name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    timeout-minutes: 120
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Lint
        run: pnpm lint

      - name: Run Format check
        run: pnpm format:check

      - name: Run test
        run: pnpm test

  stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A document the daemon serves can be current while the types generated
      # from it are not, and nothing in a test run would notice.
      - name: Check the client's generated types are current
        run: |
          pnpm --filter @notemap/client codegen
          git diff --exit-code packages/client/src/api/generated.d.ts

      - name: Run the full-stack suite
        run: pnpm test:stack

  image:
    runs-on: ubuntu-latest

    # `release.yml` builds the image on `main` and on a `v*` tag, and pushes what
    # it built. This is the other half — a pull request, before either has
    # happened — so a Dockerfile that does not build costs a re-run rather than a
    # version.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
