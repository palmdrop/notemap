name: Image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A tag made by hand can name a version the repo does not hold, and the
      # images would then be labelled something no commit says it is.
      - name: The tag matches package.json
        run: |
          held=$(node -p "require('./package.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$held" != "$tagged" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $held" >&2
            exit 1
          fi

  image:
    needs: version
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: notemap
            dockerfile: Dockerfile
          - name: notemap-relay-arena
            dockerfile: Dockerfile.relay-arena
          - name: notemap-relay-memos
            dockerfile: Dockerfile.relay-memos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The `v` is written into the patterns because `{{version}}` alone strips
      # it, and an image tag that is not the git tag is a translation everyone
      # reading a release has to do in their head.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest

      # No build cache: a tag can only read a cache written by itself or by
      # `main`, and neither ever builds these images again.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
