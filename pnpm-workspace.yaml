packages:
  - "apps/*"
  - "packages/*"
  - "packages/adapters/*"
# esbuild ships prebuilt binaries and needs its install script to place them.
# It arrives via vitest, as a devDependency only.
#
# better-sqlite3 is a native module: its install script fetches a prebuilt
# binding, or compiles one when no prebuild matches this Node ABI.
allowBuilds:
  esbuild: true
  better-sqlite3: true
minimumReleaseAgeExclude:
  - better-sqlite3@13.0.3
