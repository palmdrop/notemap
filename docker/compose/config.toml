# notemap daemon configuration, as the container runs it.
#
# Both compose files mount it read-only at /etc/notemap/config.toml, which is
# where the image's own command looks; a daemon run directly reads
# `~/.config/notemap/config.toml` instead. The annotated version of every key is
# `apps/daemon/config.example.toml`; this file is the deployed one and says only
# what the container changes.

[daemon]
pool = "/var/lib/notemap/state/notemap.db"

# The credential and the access tokens. On the volume, or every restart is a
# daemon nobody has a password for; outside the mirror, so rebuilding the pool
# restores no credential and the new deployment issues its own tokens.
auth = "/var/lib/notemap/state/auth.db"

# Every interface, which is not the daemon relaxing: a container that binds
# loopback is reachable from nothing at all, not even the proxy. The boundary
# moved to the compose network and the proxy in front of it.
host = "0.0.0.0"
port = 4747

# Where a browser reaches the daemon, which binding every interface makes
# required: nothing else says whether a session cookie may cross the network in
# the clear. An `https://` origin, or a loopback one, gets `Secure` cookies.
origin = "http://localhost:4747"

# The pool, the mirror and the assets are siblings under the one volume,
# because rebuilding needs the mirror and the assets together.
[mirror]
root = "/var/lib/notemap/pool-mirror"
pollInterval = 1000
leaseFor = 60000
batch = 16

[assets]
root = "/var/lib/notemap/assets"
maxUpload = 268435456 # bytes — 256 MiB

[retry]
maxAttempts = 5
initialBackoff = 1000
maxBackoff = 60000

[sweep]
grace = 86400000   # milliseconds — one day
interval = 3600000

[delivery]
pollInterval = 5000 # milliseconds between claims
leaseFor = 300000   # how long a claimed delivery is held before anyone may retake it
batch = 4           # deliveries claimed per pass

# The accounts a destination may be pointed at. Not a destination: this carries
# a password, and a destination's settings are pool state the mirror writes in
# the clear. A destination names an account and a folder under it.
#
# Mount the secret and name the file, or pass the variable through in the
# compose file. The path below is where compose mounts the secret declared as
# `notemap_webdav_nextcloud`, underscores and all.
# `apps/daemon/config.example.toml` annotates the whole of it.
#
# A Nextcloud in this same compose stack is reached by its service name over
# plain HTTP, which needs no certificate and crosses no network anyone else is
# on: `baseUrl = "http://nextcloud/remote.php/dav/files/alice"`.
#
# [[accounts]]
# kind = "webdav"
# name = "nextcloud"
# baseUrl = "https://cloud.example.com/remote.php/dav/files/alice"
# username = "alice"
# passwordFile = "/run/secrets/notemap_webdav_nextcloud"
