# notemap daemon configuration, as the container runs it.
#
# Mounted read-only at /etc/notemap/config.toml by `compose.yaml`. The
# annotated version of every key is `apps/daemon/config.example.toml`; this
# file is the deployed one and says only what the container changes.
#
# **Destinations are not in here.** A vault is created in settings and lives in
# the pool, so it survives a rebuild of the image and is edited without a
# restart. A leftover `[[destinations]]` block is ignored with a warning on
# startup rather than refused.

[daemon]
pool = "/var/lib/notemap/state/notemap.db"

# Every interface, which is not the daemon relaxing: a container that binds
# loopback is reachable from nothing at all, not even the proxy. The boundary
# moved to the compose network and the proxy in front of it.
host = "0.0.0.0"
port = 4747

# The pool, the mirror and the assets are siblings under the one volume,
# because rebuilding needs the mirror and the assets together.
[mirror]
root = "/var/lib/notemap/pool-mirror"
pollInterval = 1000
leaseFor = 60000
batch = 16

[assets]
root = "/var/lib/notemap/assets"
maxUpload = 268435456 # bytes — 256 MiB

[retry]
maxAttempts = 5
initialBackoff = 1000
maxBackoff = 60000

[sweep]
grace = 86400000   # milliseconds — one day
interval = 3600000

[delivery]
pollInterval = 5000 # milliseconds between claims
leaseFor = 300000   # how long a claimed delivery is held before anyone may retake it
batch = 4           # deliveries claimed per pass

# The web app stamps a typed note and a picture differently, so that policy can
# differ between them even though one page sent both.
[[sources]]
id = "web-manual"
autoRequest = []

[[sources]]
id = "web-image"
autoRequest = []

[[payloadTypes]]
name = "text"
requiredSlots = []

[payloadTypes.contentSchema]
type = "object"
required = ["text"]
additionalProperties = false

[payloadTypes.contentSchema.properties.text]
type = "string"
minLength = 1

[[payloadTypes]]
name = "image"
requiredSlots = ["image"]

[payloadTypes.contentSchema]
type = "object"
additionalProperties = false

[payloadTypes.contentSchema.properties.caption]
type = "string"
