# notemap behind a reverse proxy that already fronts your other apps.
#
# Copy this directory to the host, set `PROXY_NETWORK` in `.env` to the network
# your proxy is already on, then `docker compose -f compose.proxy.yaml up -d`.
# The proxy carries TLS and authentication; notemap has neither.

name: notemap

services:
  notemap:
    image: ghcr.io/palmdrop/notemap:${NOTEMAP_VERSION:-latest}
    restart: unless-stopped

    # No `ports:`. The daemon is on no address the host publishes; the proxy
    # reaches it as `http://notemap:4747` on the network below.
    networks: [proxy]

    volumes:
      - state:/var/lib/notemap
      - ./config.toml:/etc/notemap/config.toml:ro
      # A filesystem destination writes inside the container, so the vault it
      # names has to be visible there. The path a destination is created with in
      # settings is this one, not the host's. Writable by uid 1000, which is who
      # the daemon runs as.
      # - /srv/vault:/vault

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:4747/v1/health",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    stop_grace_period: 30s

volumes:
  state:

networks:
  # Yours, and already there — compose will not create it. Everything else on
  # it reaches an unauthenticated `/v1`, so it should be the network the proxy
  # is on and not a network everything on the host shares.
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in .env to your proxy's network}
