# notemap behind a reverse proxy.
#
# For a deployment that already has a proxy on a Docker network. Copy this
# directory to the host, set `PROXY_NETWORK` in `.env` to that network, then
# `docker compose -f compose.proxy.yaml up -d`. The proxy carries TLS and
# authentication; notemap has neither.
#
# Running on one machine with no proxy? `compose.yaml` is that case, and is a
# whole file rather than an overlay on this one.

name: notemap

services:
  notemap:
    image: ghcr.io/palmdrop/notemap:${NOTEMAP_VERSION:-latest}
    restart: unless-stopped

    # No `ports:`. The daemon is on no address the host publishes; the proxy
    # reaches it as `http://notemap:4747` on the network below.
    networks: [proxy]

    # A daemon holding no credential takes its first password from here, and
    # then the auth database owns it — `notemap password set` in the container
    # is what changes it afterwards. The _FILE form is the one to prefer: the
    # variable itself shows up in `docker inspect` and in every child process.
    # environment:
    #   NOTEMAP_PASSWORD_FILE: /run/secrets/notemap_password
    # secrets:
    #   - notemap_password

    volumes:
      - state:/var/lib/notemap
      # `/etc/notemap/config.toml` is where the image's own command looks. A
      # daemon run directly reads `~/.config/notemap/config.toml` instead.
      - ./config.toml:/etc/notemap/config.toml:ro
      # A filesystem destination writes inside the container, so the vault it
      # names has to be visible there — under /var/lib/notemap/vaults, the one
      # directory a root may be mounted at. The container reaches nothing
      # else, because nothing else is mounted. The path a destination is
      # created with in settings is the container's side, not the host's.
      # Writable by uid 1000, which is who the daemon runs as.
      # - /srv/vault:/var/lib/notemap/vaults/second-brain

    # A webdav destination reaches a Nextcloud instead, and needs the account's
    # app password. Declare the account in `config.toml` under `[[webdav]]` and
    # point `passwordFile` at the secret below; a destination then names the
    # account and a folder, and never a URL or a password. The _FILE form is the
    # one to prefer here too — an environment variable shows up in
    # `docker inspect` and in every child process.
    # secrets:
    #   - notemap_webdav_nextcloud

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:4747/v1/health",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    stop_grace_period: 30s

  # A relay reads someone else's system and captures what it finds over `/v1`,
  # carrying a token like anything else that is not a browser. Its own program
  # and its own container: nothing about it is in the daemon, which is why its
  # Memos credential never reaches the daemon's config.
  #
  # No image is published yet. Build it from the repo:
  #
  #   docker build -f Dockerfile.relay-memos -t notemap-relay-memos:local .
  #
  # Then mint the token it carries, put it beside this file, and uncomment the
  # service, the two secrets below and the `relay-memos.toml` that comes with
  # this directory:
  #
  #   docker compose exec notemap notemap token mint --name relay-memos \
  #     > notemap_relay_pool_token
  #
  # relay-memos:
  #   image: notemap-relay-memos:local
  #   restart: unless-stopped
  #
  #   # The same network the daemon is on, reached at `http://notemap:4747`.
  #   # It goes nowhere near the proxy: it is nothing anyone browses to, and it
  #   # is talking to `/v1` rather than being talked to.
  #   networks: [proxy]
  #
  #   depends_on:
  #     notemap:
  #       condition: service_healthy
  #
  #   volumes:
  #     - ./relay-memos.toml:/etc/notemap/relay-memos.toml:ro
  #
  #   # Both tokens are read from files, never inline, and read again at every
  #   # poll — so rotating either one is writing the file and never a restart.
  #   secrets:
  #     - notemap_relay_pool_token
  #     - notemap_relay_memos_token
  #
  #   # It holds nothing and owes nothing, so there is no work to finish: what
  #   # a stopped scan leaves undone, the next poll does.
  #   stop_grace_period: 10s

volumes:
  state:

# secrets:
#   notemap_password:
#     file: ./notemap_password
#   notemap_webdav_nextcloud:
#     file: ./notemap_webdav_nextcloud
#   notemap_relay_pool_token:
#     file: ./notemap_relay_pool_token
#   notemap_relay_memos_token:
#     file: ./notemap_relay_memos_token

networks:
  # Already there, and not created by compose. Everything else on it reaches
  # `/v1` behind whatever password is set, so it should be the smallest network
  # that still has the proxy on it rather than one every container shares.
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in .env to the proxy's network}
