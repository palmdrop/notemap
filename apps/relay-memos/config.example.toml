# notemap-relay-memos configuration.
#
# Copy to $XDG_CONFIG_HOME/notemap/relay-memos.toml (usually
# ~/.config/notemap/relay-memos.toml), or pass --config <path>.
#
# A relay is a program outside notemap: it reads someone else's system and
# captures what it finds over `/v1`, carrying an access token like anything else
# that is not a browser. Nothing about it is in the daemon, and nothing here is
# the daemon's config — which is why both tokens are named in this file and
# neither is in that one.
#
# An unrecognised key is refused rather than ignored. This file has a dozen keys
# and one job, so a misspelt one is a typo, not a key from a newer version.

# The notemap daemon this relay feeds.
[pool]
url = "http://127.0.0.1:4747"

# How the pool sees this relay. Every memo arrives under this source, which is
# what `GET /v1/sources` counts and what the settings screen draws — the way a
# relay that has quietly died is noticed. One per Memos server: a second server
# is a second relay, with its own config file and its own source, and giving
# them one name would merge two servers' memos under one identity.
source = "memos"

# The access token, minted with `notemap token mint --name relay-memos`. Read
# from a file or from the environment — exactly one, and never an inline
# `token`, which would put a secret in a file that is backed up and pasted into
# issues. It is read at each poll, so rotating it is writing the file.
#
# It reaches the whole pool. There is no narrower grant yet.
tokenFile = "~/.config/notemap/relay-memos/pool-token"
# tokenEnv = "NOTEMAP_RELAY_MEMOS_POOL_TOKEN"

# The Memos server this relay reads.
#
# Only the token's own user's memos are read, and only the ones that are not
# archived. On a server with more than one person on it, listing everything
# visible would pull a stranger's public memos into a private pool.
[memos]
url = "https://memos.example.com"

# An access token from Memos' own settings, under the same rule as the pool's:
# a file or the environment, exactly one, never inline.
tokenFile = "~/.config/notemap/relay-memos/memos-token"
# tokenEnv = "NOTEMAP_RELAY_MEMOS_TOKEN"

# Whether a memo's trailing line of `#tags` is classification rather than
# prose. With it, that line is read as the memo's tags and taken off the words
# captured — so a note delivered to a vault that writes tags as a `#tag` foot
# carries them once rather than twice. Memos extracts a memo's `#tags` into
# tags of its own either way, so what this adds here is the prose without them,
# and any tag Memos missed.
#
# Only the foot: a `#tag` in the middle of a sentence is a word somebody wrote
# and stays one. A line with anything else on it — `#kind/quote.`, a hashtag and
# a word — is prose, and so is the whole foot.
#
# Turning it on changes the prose of every memo carrying a foot, so the next
# poll amends or revises each of those items once. Off by default for that
# reason.
# hashtags = true

# How often everything upstream is read again. A poll holds nothing and repeats
# everything, so this is latency and nothing else: a shorter interval finds a
# memo sooner, and costs one request per page plus one per changed memo.
#
# Polls never overlap — the next is due when the last one finished.
[poll]
interval = 300000 # milliseconds — five minutes

# What the relay says on stdout: what each poll came to, what it could not
# relay, and — at `debug` — a line per memo. `text` is one line a person reads;
# `json` is one object a log collector reads. NOTEMAP_RELAY_MEMOS_LOG_LEVEL in
# the environment overrides `level` and nothing else.
[log]
level = "info"  # debug | info | warn | error
format = "text" # text | json
