<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>notemap</title>
    <style>
      :root {
        color-scheme: light dark;
        --edge: color-mix(in oklab, currentColor 18%, transparent);
        --dim: color-mix(in oklab, currentColor 60%, transparent);
        --bad: light-dark(#b3261e, #f2b8b5);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
        max-width: 42rem;
        font:
          16px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      .note {
        color: var(--dim);
        font-size: 0.8rem;
      }
      a {
        color: inherit;
      }
      form {
        display: grid;
        gap: 0.5rem;
      }
      textarea {
        width: 100%;
        min-height: 6rem;
        padding: 0.75rem;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--edge);
        border-radius: 0.5rem;
        resize: vertical;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      button {
        font: inherit;
        padding: 0.4rem 1rem;
        color: inherit;
        background: transparent;
        border: 1px solid var(--edge);
        border-radius: 0.5rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #say {
        font-size: 0.85rem;
        color: var(--dim);
      }
      #say.bad {
        color: var(--bad);
      }
      ol {
        list-style: none;
        margin: 2rem 0 0;
        padding: 0;
        display: grid;
        gap: 1px;
        background: var(--edge);
        border: 1px solid var(--edge);
        border-radius: 0.5rem;
        overflow: hidden;
      }
      li {
        padding: 0.75rem;
        background: Canvas;
      }
      li p {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      li img {
        display: block;
        max-width: 100%;
        border-radius: 0.35rem;
        margin-bottom: 0.5rem;
      }
      .picked {
        color: var(--dim);
        font-size: 0.85rem;
        overflow-wrap: anywhere;
      }
      input[type="file"] {
        font: inherit;
        font-size: 0.85rem;
        max-width: 100%;
      }
      li time {
        display: block;
        margin-top: 0.35rem;
        font-size: 0.75rem;
        color: var(--dim);
      }
      #more {
        margin-top: 1rem;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>notemap</h1>
      <span class="note"
        >online only &mdash; a capture needs the daemon reachable &middot;
        <a href="/log">log</a></span
      >
    </header>

    <form id="capture">
      <textarea
        id="text"
        placeholder="Anything worth keeping&hellip;"
        aria-label="What to capture"
      ></textarea>
      <div class="row">
        <input
          id="file"
          type="file"
          accept="image/*"
          aria-label="A picture to capture"
        />
        <span id="picked" class="picked"></span>
      </div>
      <div class="row">
        <button type="submit">Capture</button>
        <span id="say" role="status"></span>
      </div>
    </form>

    <ol id="feed"></ol>
    <button id="more" hidden>Load more</button>

    <script type="module">
      const SOURCE = "web";
      const TEXT = "text";
      const IMAGE = "image";
      /** The slot `image` captures declare required, per the example config. */
      const SLOT = "image";

      const form = document.getElementById("capture");
      const text = document.getElementById("text");
      const file = document.getElementById("file");
      const picked = document.getElementById("picked");
      const say = document.getElementById("say");
      const feed = document.getElementById("feed");
      const more = document.getElementById("more");

      /** `crypto.randomUUID()` is v4; this is v7, so ids sort by mint time. */
      function uuidv7() {
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        const millis = Date.now();

        for (let i = 0; i < 6; i += 1) {
          bytes[i] = Number((BigInt(millis) >> BigInt(8 * (5 - i))) & 0xffn);
        }
        bytes[6] = (bytes[6] & 0x0f) | 0x70;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;

        const hex = [...bytes].map((b) => b.toString(16).padStart(2, "0"));
        return [
          hex.slice(0, 4).join(""),
          hex.slice(4, 6).join(""),
          hex.slice(6, 8).join(""),
          hex.slice(8, 10).join(""),
          hex.slice(10, 16).join(""),
        ].join("-");
      }

      function tell(message, bad = false) {
        say.textContent = message;
        say.classList.toggle("bad", bad);
      }

      function readError(body) {
        const error = body?.error;
        if (!error?.code) return "something went wrong";

        switch (error.code) {
          case "payload-invalid":
            return "nothing to capture";
          case "capture-id-conflict":
          case "source-item-changed":
            return "that capture already exists, with different content";
          case "unknown-payload-type":
            return `this daemon has no "${error.type}" payload type configured`;
          case "missing-asset-slot":
            return `a capture of this type needs a file in "${error.slot}"`;
          case "unknown-asset":
            return "the upload is gone; pick the file again";
          case "asset-too-large":
            return `that file is larger than this daemon accepts (${error.max} bytes)`;
          case "missing-filename":
            return "the file has no name";
          default:
            return `refused: ${error.code}`;
        }
      }

      function render(items) {
        for (const item of items) {
          const li = document.createElement("li");

          // Full size: a thumbnail endpoint is deliberately not built.
          for (const ref of item.payload?.assets ?? []) {
            const image = document.createElement("img");
            image.src = `/v1/assets/${encodeURIComponent(ref.asset)}/content`;
            image.alt = "";
            image.loading = "lazy";
            li.append(image);
          }

          const p = document.createElement("p");
          p.textContent =
            item.payload?.content?.text ?? item.payload?.content?.caption ?? "";

          const when = document.createElement("time");
          when.dateTime = item.createdAt;
          when.textContent = new Date(item.createdAt).toLocaleString();

          li.append(p, when);
          feed.append(li);
        }
      }

      /**
       * The bytes go up in their own request, and only a `201` is followed by a
       * capture: two requests where there was one, and the second must not fire
       * if the first failed.
       */
      async function upload(chosen) {
        const response = await fetch("/v1/assets", {
          method: "POST",
          headers: {
            "content-type": chosen.type || "application/octet-stream",
            "content-disposition": `attachment; filename*=UTF-8''${encodeURIComponent(chosen.name)}`,
          },
          body: chosen,
        });

        const result = await response.json();
        if (response.status !== 201) throw new Error(readError(result));
        return result;
      }

      let next = "/v1/feed?limit=25";

      async function loadMore() {
        if (!next) return;
        more.disabled = true;

        try {
          const response = await fetch(next);
          const slice = await response.json();
          if (!response.ok) throw new Error(readError(slice));

          render(slice.values);
          next = slice.next ?? null;
          more.hidden = !next;
        } catch (error) {
          tell(String(error.message ?? error), true);
        } finally {
          more.disabled = false;
        }
      }

      async function reload() {
        feed.replaceChildren();
        next = "/v1/feed?limit=25";
        more.hidden = true;
        await loadMore();
      }

      file.addEventListener("change", () => {
        const chosen = file.files?.[0];
        picked.textContent = chosen ? `${chosen.name}` : "";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const body = text.value;
        const chosen = file.files?.[0];
        if (chosen === undefined && body.trim() === "") return;

        const id = uuidv7();
        const button = form.querySelector("button");
        button.disabled = true;
        file.disabled = true;

        try {
          let assets = [];
          if (chosen !== undefined) {
            tell("uploading…");
            const asset = await upload(chosen);
            assets = [{ slot: SLOT, asset: asset.id }];
          }

          tell("capturing…");
          const payload =
            chosen === undefined
              ? { type: TEXT, content: { text: body } }
              : {
                  type: IMAGE,
                  content: body.trim() === "" ? {} : { caption: body },
                };

          const response = await fetch("/v1/captures", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              id,
              source: SOURCE,
              sourceItemId: id,
              capturedAt: new Date().toISOString(),
              payload: { ...payload, metadata: {}, assets },
            }),
          });

          const result = await response.json();

          if (response.status === 201) {
            text.value = "";
            file.value = "";
            picked.textContent = "";
            tell("captured");
            await reload();
          } else if (response.status === 200) {
            tell(`already captured (matched on ${result.matchedOn})`);
          } else {
            tell(readError(result), true);
          }
        } catch (error) {
          // An upload that failed reports its own refusal verbatim; anything
          // without one is the daemon being unreachable.
          tell(error?.message ?? "the daemon is not reachable", true);
        } finally {
          button.disabled = false;
          file.disabled = false;
        }
      });

      more.addEventListener("click", loadMore);
      reload();
    </script>
  </body>
</html>
