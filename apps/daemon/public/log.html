<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>notemap — the action log</title>
    <style>
      /*
        Copied from `apps/ui/src/styles/tokens.css`, which stays the source of
        truth: this page loads nothing but the daemon, so it cannot import them.
        `src/log/log.test.ts` fails when the two disagree.
      */
      :root {
        color-scheme: light dark;

        --paper: light-dark(oklch(0.972 0.009 85), oklch(0.185 0.008 60));
        --ink: light-dark(oklch(0.24 0.013 55), oklch(0.93 0.006 85));
        --ink-muted: light-dark(oklch(0.58 0.011 55), oklch(0.63 0.01 60));
        --accent: light-dark(oklch(0.55 0.215 28), oklch(0.58 0.225 27));

        --face-prose: serif;
        --face-mono: monospace;
        --size: 1.0625rem;

        --rail: 17rem;
        --gap: 2.2rem;
        --measure: 72rem;

        --rule: color-mix(in oklab, var(--ink) 20%, transparent);
      }

      @media (width < 44rem) {
        :root {
          --rail: 6.5rem;
          --gap: 1rem;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 1.5rem 1rem 8rem;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--face-mono);
        font-size: var(--size);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .frame {
        max-width: var(--measure);
        margin: 0 auto;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        color: var(--accent);
      }

      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.25rem 1.5rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--ink);
      }
      .wordmark {
        font-family: var(--face-prose);
        font-variant-caps: small-caps;
        text-transform: lowercase;
        letter-spacing: 0.12em;
      }
      .nav {
        display: flex;
        gap: 1rem;
      }
      .chrome {
        margin-left: auto;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.25rem 1rem;
      }

      .order {
        display: flex;
        align-items: baseline;
        gap: 0.25rem;
      }
      select {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        border-radius: 0;
        padding: 0;
        appearance: none;
        cursor: pointer;
      }

      #say {
        color: var(--ink-muted);
      }
      #say.bad {
        color: var(--accent);
      }

      .lede {
        margin: 2rem 0 0;
        color: var(--ink-muted);
      }
      .lede a {
        color: var(--ink);
      }

      .register {
        margin-top: 1.5rem;
        display: grid;
        grid-template-columns: var(--rail) 1fr;
        column-gap: var(--gap);
      }
      .rail,
      .body {
        border-top: 1px solid var(--rule);
        padding: 1.25rem 0;
        min-width: 0;
      }
      .rail {
        grid-column: 1;
      }
      .body {
        grid-column: 2;
        overflow-wrap: anywhere;
      }
      .register > .rail:first-child,
      .register > .rail:first-child + .body {
        border-top: 0;
      }

      .when {
        display: flex;
        gap: 1ch;
      }
      .when .time {
        color: var(--ink-muted);
      }
      @media (width < 44rem) {
        .when {
          display: block;
        }
      }

      .by {
        margin-top: 0.5rem;
        color: var(--ink-muted);
      }

      .about,
      .detail {
        margin-top: 0.5rem;
        color: var(--ink-muted);
      }

      .nothing {
        padding: 5rem 0;
      }
      .word {
        display: inline-block;
        width: max-content;
        background: var(--ink);
        color: var(--paper);
        padding: 0 0.375rem;
        margin-left: -0.375rem;
      }

      .foot {
        grid-column: 2;
        padding-top: 1.5rem;
      }
      button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        color: var(--accent);
      }
      button:disabled {
        color: var(--ink-muted);
        cursor: default;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="bar">
        <a class="wordmark" href="/">notemap</a>
        <span class="nav">
          <a href="/">queue</a>
          <a href="/feed">feed</a>
        </span>
        <span class="chrome">
          <label class="order">
            <select id="order" aria-label="Order">
              <option value="oldest-first">oldest</option>
              <option value="newest-first">newest</option>
            </select>
            <span aria-hidden="true">▾</span>
          </label>
          <span id="say" role="status"></span>
          <a href="/docs">api</a>
          <a href="/settings">settings</a>
        </span>
      </div>

      <p class="lede">
        Everything this pool has done, in the order it happened.
        <span id="filter" hidden></span>
      </p>

      <div class="register" id="log"></div>
    </div>

    <script type="module">
      const PAGE = 25;

      const log = document.getElementById("log");
      const order = document.getElementById("order");
      const filter = document.getElementById("filter");
      const say = document.getElementById("say");

      const here = new URL(location.href);
      const item = here.searchParams.get("item") ?? undefined;
      const reading =
        here.searchParams.get("order") === "oldest-first"
          ? "oldest-first"
          : "newest-first";

      function tell(message, bad = false) {
        say.textContent = message;
        say.classList.toggle("bad", bad);
      }

      function agentOf(by) {
        switch (by?.kind) {
          case "person":
            return "by you";
          case "provider":
            return `by provider ${by.provider}`;
          case "source":
            return `by source ${by.source}`;
          case "notemap":
            return "by notemap";
          default:
            return "by nobody named";
        }
      }

      /** Fixed width, so a column of them is countable. */
      const pad = (value) => String(value).padStart(2, "0");

      function dayOf(at) {
        const when = new Date(at);
        return `${when.getFullYear()}-${pad(when.getMonth() + 1)}-${pad(when.getDate())}`;
      }

      function timeOf(at) {
        const when = new Date(at);
        return `${pad(when.getHours())}:${pad(when.getMinutes())}`;
      }

      function pageFor(overrides = {}) {
        const url = new URL("/log", location.origin);
        const wanted = { item, order: reading, ...overrides };
        if (wanted.item !== undefined)
          url.searchParams.set("item", wanted.item);
        if (wanted.order !== "newest-first") {
          url.searchParams.set("order", wanted.order);
        }
        return url.pathname + url.search;
      }

      function cell(kind, into) {
        const element = document.createElement("div");
        element.className = kind;
        into.append(element);
        return element;
      }

      function line(className, text, into) {
        const element = document.createElement("div");
        element.className = className;
        if (text !== undefined) element.textContent = text;
        into.append(element);
        return element;
      }

      function render(entries) {
        for (const entry of entries) {
          const rail = cell("rail", log);

          const when = line("when", undefined, rail);
          const day = document.createElement("time");
          day.dateTime = entry.at;
          day.textContent = dayOf(entry.at);
          when.append(day);
          line("time", timeOf(entry.at), when);

          line("by", agentOf(entry.by), rail);

          const body = cell("body", log);
          line("kind", entry.kind, body);

          if (entry.subject !== undefined) {
            const about = line("about", undefined, body);
            const link = document.createElement("a");
            link.href = pageFor({ item: entry.subject });
            link.textContent = entry.subject;
            about.append("about ", link);
          }

          if (Object.keys(entry.detail ?? {}).length > 0) {
            line("detail", JSON.stringify(entry.detail), body);
          }
        }
      }

      function first() {
        const url = new URL("/v1/actions", location.origin);
        url.searchParams.set("limit", String(PAGE));
        url.searchParams.set("order", reading);
        if (item !== undefined) url.searchParams.set("item", item);
        return url.pathname + url.search;
      }

      let next = first();
      let seen = 0;

      const foot = document.createElement("div");
      foot.className = "foot";
      const more = document.createElement("button");
      more.type = "button";
      more.textContent = "load more";
      more.hidden = true;
      foot.append(more);

      async function loadMore() {
        if (!next) return;
        more.disabled = true;

        try {
          const response = await fetch(next);
          const slice = await response.json();
          if (!response.ok) {
            throw new Error(slice?.error?.code ?? "something went wrong");
          }

          render(slice.values);
          seen += slice.values.length;
          next = slice.next ?? null;
          more.hidden = !next;

          if (seen === 0) {
            const rail = cell("rail", log);
            const nothing = line("nothing", undefined, rail);
            line("word", "quiet", nothing);

            const body = cell("body", log);
            const said = line("nothing", undefined, body);
            line(
              "kind",
              item === undefined
                ? "Nothing has happened yet."
                : "Nothing is recorded about that item.",
              said,
            );
          }

          log.append(foot);
          tell(`${seen} shown`);
        } catch (error) {
          tell(`${String(error.message ?? error)} — try again`, true);
          // The read that failed is still the next one to make, so the button
          // has to come back whether or not it was ever shown.
          more.hidden = false;
          log.append(foot);
        } finally {
          more.disabled = false;
        }
      }

      order.value = reading;
      order.addEventListener("change", () => {
        location.href = pageFor({ order: order.value });
      });

      if (item !== undefined) {
        filter.hidden = false;
        const clear = document.createElement("a");
        clear.href = pageFor({ item: undefined });
        clear.textContent = "show everything";
        filter.append(` Only what is about ${item} — `, clear);
      }

      more.addEventListener("click", loadMore);
      loadMore();
    </script>
  </body>
</html>
