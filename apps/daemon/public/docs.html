<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>notemap API</title>
    <link rel="stylesheet" href="/docs/swagger-ui.css" />
    <style>
      body {
        margin: 0;
      }
      .swagger-ui .topbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="swagger"></div>
    <script src="/docs/swagger-ui-bundle.js"></script>
    <script>
      SwaggerUIBundle({
        url: "/v1/openapi.json",
        dom_id: "#swagger",
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
        deepLinking: true,
        tryItOutEnabled: true,
        displayRequestDuration: true,
        defaultModelsExpandDepth: 2,
        // Every /v1 write declares its media type, carrying a body or not, and
        // Swagger sends none where the operation takes none.
        requestInterceptor: (request) => {
          const writes = ["POST", "PUT", "PATCH"];
          const declared =
            request.headers["Content-Type"] ?? request.headers["content-type"];

          if (writes.includes(request.method) && !declared) {
            request.headers["Content-Type"] = "application/json";
          }

          return request;
        },
      });
    </script>
  </body>
</html>
