# notemap daemon configuration, for a daemon run directly on a host.
#
# Copy to $XDG_CONFIG_HOME/notemap/config.toml (usually ~/.config/notemap/config.toml),
# or pass --config <path>. The container deployment has its own file,
# `docker/compose/config.toml`, with the paths under the volume and a bind
# address to match; this one stays the annotated reference.
#
# Keys are core's own names, so `docs/specs/core.md` reads as documentation for
# this file. Absent lists mean empty.
#
# **Destinations are not in here.** A vault is created in settings and lives in
# the pool, so it survives a reinstall and is edited without a restart. A
# leftover `[[destinations]]` block is ignored with a warning on startup rather
# than refused.

[daemon]
pool = "~/.local/share/notemap/state/notemap.db"

# The credential and the access tokens, in a database the daemon owns. Beside
# the pool and never inside it: it is not the pool's material, the mirror never
# writes it, and rebuilding a pool from the mirror is a new deployment that
# should issue its own tokens.
auth = "~/.local/share/notemap/state/auth.db"

host = "127.0.0.1"
port = 4747

# Where a browser reaches the daemon. Optional on loopback, and required the
# moment `host` is anything else — a session cookie has no other way to know
# whether it may travel over plain HTTP. `https://` gets `__Host-` cookies; a
# loopback origin keeps `Secure` without the prefix, which Chromium rejects over
# plain HTTP; a plain-HTTP origin on a real address gives up both, and the daemon
# says so on startup.
#
# Set it here too where a tunnel or a proxy puts a name in front of a daemon
# still bound to loopback. Nothing about the bind address gives that away, and a
# browser reaching `http://notemap.internal:4747` drops a cookie minted for
# loopback — so the daemon logs the first sign-in whose host disagrees.
# origin = "https://notes.example.com"

# The plain-file copy of everything, written and never read back. Delete this
# whole table and the mirror is off: nothing is written, and no work is even
# recorded as owed — which makes the SQLite file the only copy of everything.
#
# `root` is a sibling of `state/`, because rebuilding needs the mirror and the
# assets together: the backup unit is the whole `notemap/` directory.
[mirror]
root = "~/.local/share/notemap/pool-mirror"
pollInterval = 1000 # milliseconds between sweeps for owed writes
leaseFor = 60000    # how long a claimed write is held before anyone may retake it
batch = 16          # writes claimed per sweep

# What a capture with no offset of its own is read in. A browser sends the zone
# it was in with every capture; a source-supplied one sends none, and this is
# where its date comes from — a filename derived from a capture date is
# otherwise a day out for exactly the person who cared enough to configure it.
#
# Absent means this host's own zone, which is what `Intl` reports. Never UTC
# unless that is genuinely where this machine lives.
[capture]
# zone = "Europe/Stockholm"

[retry]
maxAttempts = 5
initialBackoff = 1000 # milliseconds
maxBackoff = 60000

# Where blobs go. Unlike the mirror this is not optional: a pool that cannot
# store bytes cannot capture an image at all. A sibling of `state/` again,
# because rebuilding needs the mirror and the assets together.
#
# The limit is enforced against the bytes as they arrive, not against
# `Content-Length`, which is a claim.
[assets]
root = "~/.local/share/notemap/assets"
maxUpload = 268435456 # bytes — 256 MiB

# An upload whose capture never arrives is eventually swept, along with the blob
# it was the last asset of. `grace` is how long "just uploaded" is left alone:
# to a sweep running at the wrong instant, referenced and about-to-be-referenced
# look identical.
[sweep]
grace = 86400000   # milliseconds — one day
interval = 3600000 # milliseconds between sweeps

# How often deliveries that could not be carried out inline are retried. Slower
# than the mirror, and with a longer lease: a delivery is waiting on something
# outside this machine, and a lease that expires mid-delivery is abandoned
# rather than retried, since nobody can say whether the bytes landed.
[delivery]
pollInterval = 5000 # milliseconds between claims
leaseFor = 300000   # how long a claimed delivery is held before anyone may retake it
batch = 4           # deliveries claimed per pass

# The accounts a destination may be pointed at. This is the one part of a
# destination that is not created in settings, and the reason is that it carries
# a password: a destination's settings are pool state, answered verbatim by
# `GET /v1/destinations` and written to the mirror in the clear, so a credential
# in one is a credential every access token can read and every backup keeps.
#
# The base URL travels with the secret rather than being a field on the
# destination. Otherwise whoever can create a destination over `/v1` could aim
# the daemon at any address it can reach and have it deliver there with this
# password attached, over and over, on the delivery runner's own timer.
#
# A destination then names an account and a folder under it — never a URL, never
# a secret. Several vaults on one account are several destinations naming one
# account.
#
# `kind` is the destination kind that speaks to it, and it is what an adapter
# finds its own accounts by; the daemon reads this block without knowing what
# any of the kinds are. A name has to be unique within its kind and nowhere
# else, so two kinds may each have a `main`.
#
# `baseUrl` is the collection the account is rooted at. For Nextcloud over
# webdav that is `https://<host>/remote.php/dav/files/<user>`, which is the
# whole of that user's files; a vault below it is the destination's own folder.
#
# Plain HTTP costs nothing where the password cannot cross a network somebody
# else is on: loopback, a private or link-local address, or a single-label name
# — which is what a container on the same network is called, so a Nextcloud in
# the same compose stack is `http://nextcloud/remote.php/dav/files/alice`.
# Anywhere else it still works, and the daemon names the account on startup as
# one whose password crosses the network in the clear.
#
# The secret is `passwordFile` or `passwordEnv` — exactly one, and never an
# inline `password`, which would put it in this file. It is read when a delivery
# needs it rather than at startup, so rotating one is writing the file. Use an
# app password rather than the account's own where the server offers them.
#
# [[accounts]]
# kind = "webdav"
# name = "nextcloud"
# baseUrl = "https://cloud.example.com/remote.php/dav/files/alice"
# username = "alice"
# passwordFile = "~/.config/notemap/nextcloud-app-password"
#
# The same account, taking its secret from the environment instead. Exactly one
# of the two, so this is an alternative to the line above and not a companion.
#
# [[accounts]]
# kind = "webdav"
# name = "nextcloud"
# baseUrl = "https://cloud.example.com/remote.php/dav/files/alice"
# username = "alice"
# passwordEnv = "NOTEMAP_WEBDAV_NEXTCLOUD"

# A source needs no declaration to capture; declaring one attaches policy.
#
# A source is the capture *channel*, not the shell: the web app stamps a typed
# note and a picture differently, so that policy can differ between them even
# though one page sent both.
[[sources]]
id = "web-manual"
autoRequest = []

[[sources]]
id = "web-image"
autoRequest = []

[[payloadTypes]]
name = "text"
requiredSlots = []

[payloadTypes.contentSchema]
type = "object"
required = ["text"]
additionalProperties = false

[payloadTypes.contentSchema.properties.text]
type = "string"
minLength = 1

# The first type with a required slot: a capture of this type that names no
# asset in `image` is refused, and the bytes go up in their own request first.
# The caption is optional, and the whole of the content.
[[payloadTypes]]
name = "image"
requiredSlots = ["image"]

[payloadTypes.contentSchema]
type = "object"
additionalProperties = false

[payloadTypes.contentSchema.properties.caption]
type = "string"
