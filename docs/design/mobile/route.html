<!doctype html>
<html lang="en" data-frame="phone">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>notemap design: route</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/route.css" />
    <link rel="stylesheet" href="css/record.css" />
    <link rel="stylesheet" href="css/notices.css" />
    <link rel="stylesheet" href="css/bars.css" />
    <script type="module" src="js/design.js"></script>
    <script type="module" src="js/route.js"></script>
    <script type="module" src="js/keyboard.js"></script>
  </head>
  <body>
    <div class="device">
      <div class="screen route">
        <header class="route-head">
          <div class="route-bar">
            <a class="icon-button" href="queue.html" aria-label="Close"><svg class="i"><use href="#i-close"></use></svg></a>
            <h1>route</h1>
            <span class="step-of"></span>
          </div>
          <p class="excerpt"></p>
        </header>
        <section class="route-note" aria-label="The item" hidden>
          <footer class="toolbar">
            <button class="pill danger" data-act="discard"><svg class="i"><use href="#i-trash"></use></svg>Discard</button>
            <button class="pill" data-act="done"><svg class="i"><use href="#i-check"></use></svg>Done</button>
          </footer>
          <p class="rn-when"></p>
          <div class="rn-pictures"></div>
          <p class="rn-words"></p>
        </section>
        <main class="step"></main>
        <footer class="route-foot">
          <nav class="steps" aria-label="Steps"></nav>
          <div class="route-done"></div>
        </footer>
      </div>
    </div>
  </body>
</html>
